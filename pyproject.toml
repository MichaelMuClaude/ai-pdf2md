[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-pdf2md"
version = "0.1.0"
description = "Convert PDFs to AI-friendly Markdown (structure-preserving: headings, tables, lists)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-pdf2md = "ai_pdf2md.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_pdf2md"]
